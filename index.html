<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nursery App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14532D">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NurseryApp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="offline.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14532D; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  /* safe-area iPhone: bagian atas (status bar / poni) diberi warna tema, aplikasi mulai di bawahnya */
  #app { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #F4F8F2; }
  .lapis { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F4F8F2; color: #14532D; text-align: center; padding: 24px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
  .lapis[hidden] { display: none; }
  .lapis img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 28px rgba(20,83,45,.25); }
  .lapis h1 { margin: 0; font-size: 20px; }
  .lapis p { margin: 0; color: #4b6b55; font-size: 14px; max-width: 320px; line-height: 1.45; }
  .putar { width: 26px; height: 26px; border: 3px solid #cfe3c6; border-top-color: #2f7d4f; border-radius: 50%; animation: p .8s linear infinite; }
  @keyframes p { to { transform: rotate(360deg); } }
  .tombol { border: 0; border-radius: 12px; padding: 12px 20px; background: #2f7d4f; color: #fff; font-weight: 700; font-size: 15px; min-height: 46px; cursor: pointer; margin: 4px; }
  .tombol.dua { background: #fff; color: #14532D; border: 1.5px solid #cfe3c6; }
  #lambat { display: none; }
</style>
</head>
<body>
<iframe id="app" title="Nursery App" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation" allowfullscreen></iframe>

<div id="memuat" class="lapis">
  <img src="icon-192.png" alt="">
  <h1>Membuka Nursery App...</h1>
  <div class="putar" aria-hidden="true"></div>
  <p id="lambat">Masih memuat. Bila sinyal lemah, catat dulu tanpa sinyal; data dikirim otomatis nanti.<br><br><button class="tombol" onclick="bukaOffline()">Catat tanpa sinyal</button><button class="tombol dua" onclick="muat(true)">Muat ulang</button></p>
</div>

<div id="salah" class="lapis" hidden>
  <img src="icon-192.png" alt="">
  <h1>Alamat aplikasi belum diatur</h1>
  <p>Buka file <b>alamat.js</b> di repository ini, lalu ganti isi <b>NURSERY_APP_URL</b> dengan URL Web App Apps Script Anda yang berakhiran <b>/exec</b>.</p>
</div>

<button id="pilOff" hidden onclick="bukaOffline()">📵 Tanpa sinyal · Catat offline</button>

<script src="alamat.js"></script>
<script src="offline.js"></script>
<script>
(function () {
  var APP_URL = String(window.NURSERY_APP_URL || 'GANTI_DENGAN_ID_DEPLOYMENT');
  var frame = document.getElementById('app'), memuat = document.getElementById('memuat'), lambat = document.getElementById('lambat'), pil = document.getElementById('pilOff');
  var tunda = null, siap = false, hidup = false, penanya = null, asalApp = '';   /* penanya = jendela aplikasi (iframe googleusercontent di dalam halaman Google) */
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var OFF = window.OFFLINE || null;
  function standalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function info() { return { type: 'es-info', installable: !!tunda, standalone: standalone(), ios: ios, alamat: location.origin + location.pathname, offline: !!OFF }; }
  function kirimInfo(ke) { try { (ke || penanya || frame.contentWindow).postMessage(info(), '*'); } catch (e) {} }
  /* Hanya menerima pesan dari aplikasi Apps Script */
  function asalSah(o) { try { var h = new URL(o).hostname; return h === 'script.google.com' || /(^|\.)googleusercontent\.com$/.test(h); } catch (e) { return false; } }
  /* Pesan ke aplikasi (mode offline): hanya ke jendela & asal aplikasi yang sudah menyapa */
  function keApp(msg) { if (!penanya || !asalApp) return false; try { penanya.postMessage(msg, asalApp); return true; } catch (e) { return false; } }

  window.bukaOffline = function () { if (OFF) OFF.buka(); };
  function bukaApp() {
    if (!navigator.onLine) return;
    if (!hidup) window.muat(true);
    if (OFF) OFF.tutup();
  }

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); tunda = e; kirimInfo(); });
  window.addEventListener('appinstalled', function () { tunda = null; kirimInfo(); });
  window.addEventListener('message', function (e) {
    if (!asalSah(e.origin)) return;
    var d = e.data || {}, t = d.type;
    if (e.source) penanya = e.source;
    if (t === 'es-tanya') { hidup = true; kirimInfo(e.source); }
    else if (t === 'es-install') {
      if (!tunda) return kirimInfo(e.source);
      var p = tunda; tunda = null; p.prompt();
      Promise.resolve(p.userChoice).then(function () { kirimInfo(e.source); }, function () { kirimInfo(e.source); });
    }
    else if (t === 'es-reload') window.muat(true);
    else if (!OFF) return;
    /* ---- mode offline ---- */
    else if (t === 'es-opsi') OFF.opsi(d.opsi);
    else if (t === 'es-siap') { hidup = true; asalApp = e.origin; OFF.siap(d.akun); }
    else if (t === 'es-hasil') OFF.hasil(d);
    else if (t === 'es-keluar') OFF.keluar(!!d.hapus);
    else if (t === 'es-buka-offline') OFF.buka();
  });

  /* Parameter QR (?menu=..&k=.. atau ?bibit=..) diteruskan ke aplikasi. Hanya nama & pola yang dikenal; sisanya dibuang.
     Keamanan TETAP diperiksa di server (Code.gs) - penyaringan di sini hanya agar alamat rapi. */
  var POLA = { menu: /^(bibit|lapangan|workshop|gudang)$/, k: /^[A-Za-z0-9_-]{8,80}$/, bibit: /^[a-z0-9-]{1,60}$/ };
  function paramQR() {
    var q = new URLSearchParams(location.search), out = [];
    Object.keys(POLA).forEach(function (n) { var v = q.get(n); if (v && POLA[n].test(v)) out.push(n + '=' + encodeURIComponent(v)); });
    return out;
  }
  window.muat = function (paksa) {
    if (APP_URL.indexOf('GANTI_DENGAN') > -1 || !/^https:\/\//.test(APP_URL)) { memuat.hidden = true; document.getElementById('salah').hidden = false; return; }
    if (!navigator.onLine) { memuat.hidden = true; if (OFF) OFF.buka(); return; }
    memuat.hidden = false; lambat.style.display = 'none'; siap = false; hidup = false;
    var p = paramQR(); if (paksa) p.push('r=' + Date.now());   /* r= mencegah browser memakai halaman lama dari cache */
    frame.src = APP_URL + (p.length ? (APP_URL.indexOf('?') > -1 ? '&' : '?') + p.join('&') : '');
    setTimeout(function () { if (!siap) lambat.style.display = 'block'; }, 20000);
  };
  frame.addEventListener('load', function () { if (!frame.src) return; siap = true; memuat.hidden = true; });
  window.addEventListener('offline', function () {
    if (!hidup) { memuat.hidden = true; if (OFF) OFF.buka(); }
    else if (OFF) pil.hidden = false;   /* aplikasi tetap tampil; pil kecil untuk beralih ke catat offline */
    if (OFF) OFF.jaringan();
  });
  window.addEventListener('online', function () {
    pil.hidden = true;
    if (OFF) OFF.jaringan();
    if (!hidup) window.muat(true);   /* panel offline (bila terbuka) tetap di atas; aplikasi dimuat di belakang lalu data dikirim */
  });

  if ('serviceWorker' in navigator) {
    var adaPengendali = !!navigator.serviceWorker.controller, muatUlang = false;
    navigator.serviceWorker.register('sw.js').catch(function () {});
    /* VERSI di sw.js naik -> service worker baru aktif -> halaman dimuat ulang sekali (kecuali sedang mengisi formulir offline) */
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (!adaPengendali || muatUlang) { adaPengendali = true; return; } if (OFF && OFF.diForm()) return; muatUlang = true; location.reload(); });
  }
  if (OFF) OFF.init({ kirim: keApp, bukaApp: bukaApp });
  window.muat(false);
})();
</script>
</body>
</html>
